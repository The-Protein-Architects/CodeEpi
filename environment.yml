name: codeepi
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.8
  - pip=26.0.1
  - dssp=4.6.1=np2py310h64a3ab5_0
  - libmcfp=2.0.1=h171cf75_0
  - libboost=1.86.0=hd24cca6_5
  - libboost-python=1.86.0=py310hc563356_5
  # PyTorch and PyG 
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - numpy==1.26.4
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - pandas==2.3.3
      - pyyaml==6.0.3
      - biopython==1.81
      - biotite==0.41.2
      - tqdm
      - torch==2.1.1+cu121
      - torch-geometric==2.5.3
      - torch-scatter==2.1.2+pt21cu121
      - torch-sparse==0.6.18+pt21cu121
      - torch-cluster==1.6.3+pt21cu121

      # ESM-IF-1 encoder (esm.inverse_folding / esm.pretrained). This is
      # fair-esm; the ESM-C API client lives in the separate environment-esmc.yml.
      - fair-esm==2.0.0
      # ---------------------------------------------------------------------
      # ESM-IF-1 WEIGHTS ARE NOT DOWNLOADED AUTOMATICALLY. Prediction aborts
      # with instructions if they are missing. Fetch them once, by hand, into
      # the torch hub cache:
      #   mkdir -p ~/.cache/torch/hub/checkpoints
      #   wget -O ~/.cache/torch/hub/checkpoints/esm_if1_gvp4_t16_142M_UR50.pt \
      #     https://dl.fbaipublicfiles.com/fair-esm/models/esm_if1_gvp4_t16_142M_UR50.pt
      # Using a custom cache dir? export TORCH_HOME before running.
      # ---------------------------------------------------------------------

